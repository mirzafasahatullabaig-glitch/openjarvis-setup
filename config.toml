# Code Assistant — agent with code execution, file I/O, and shell access
# Copy to ~/.openjarvis/config.toml
#
# Usage:
#   jarvis ask "Write a Python script that parses CSV files"
#   jarvis ask "Read main.py and explain the architecture"
#   jarvis ask --agent orchestrator "Find and fix the bug in test_utils.py"

[engine]
default = "ollama"

[engine.ollama]
host = "http://127.0.0.1:11434"

[intelligence]
preferred_engine = "ollama"        # force local Ollama, not the NIM cloud router

# Role mapping — default_model applies when -m is omitted. Pick any model
# explicitly with `-m <name>` (e.g. -m qwen2.5-coder:7b). NOTE: `-m smart`
# is NOT supported by this build (Ollama rejects "smart" as a model name).
default_model = "qwen2.5:7b"       # runs 100% on GPU (4.8GB fits 8GB VRAM); GUI uses this
model_chat    = "qwen2.5:7b"       # conversation, full GPU
model_code    = "qwen2.5-coder:7b" # coding tasks, full GPU
model_short   = "qwen3.5:4b"       # fast / short replies, full GPU
model_long    = "qwen2.5:14b"      # max quality; ~38% spills to CPU (10GB > 8GB VRAM)
fallback_model = "qwen2.5:7b"
# Pick the smarter-but-partly-CPU 14B explicitly when you want it:
#   jarvis ask -m qwen2.5:14b "..."

# All installed Ollama models (auto-discovered; use any with  -m <name> ):
#   dolphincoder:15b        qwen2.5:14b           llama3.1:8b
#   qwen2.5:7b              qwen2.5-coder:7b      dolphin-llama3:8b
#   deepseek-coder:6.7b     gemma3:4b             qwen3.5:4b
#   qwen3.5:2b              llama3.2:3b           qwen3-vl:2b
#   qwen2.5:3b              qwen3-vl:2b-instruct  granite4:350m
#   smollm2:360m            qwen:0.5b             qwen2.5:0.5b-instruct
#   qwen2:0.5b-instruct     smollm2:135m          reader-lm:0.5b
# (qwen3-vl:* are vision models; reader-lm is for HTML->markdown.)

[agent]
default_agent = "orchestrator"      # Multi-turn with tool selection
max_turns = 10

[tools]
enabled = ["code_interpreter", "file_read", "file_write", "shell_exec", "web_search", "think", "calculator"]

[speech]
# STT on GPU. Needs the venv's nvidia cublas/cudnn DLL dirs on PATH BEFORE
# launch (see run-jarvis.ps1) — faster-whisper's native loader won't find
# them otherwise. Much faster than CPU after first-run CUDA init.
device = "cuda"
compute_type = "float16"
model = "base"

[security]
profile = "personal"               # loopback-only + PII redaction (single-user local)

[analytics]
enabled = false
choice_recorded = true
